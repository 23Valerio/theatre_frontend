<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Треск!</title>
  </head>
  <body>
    <div class="main-container">
      <header class="site-header">
        <div class="header-container">
          <img class="logo" src="/Logo_Tresk.svg">   
          <button class="burger" id="burger-button">
            <span></span>
            <span></span>
            <span></span>
          </button>
          <nav class="main-nav" id="main-nav">
            <ul>
              <li><a href="#" data-route="/home">Главная</a></li>
              <li><a href="#" data-route="/program">Программа</a></li>
              <li><a href="#" data-route="/about">О нас</a></li>
              <li><a href="#" data-route="/contacts">Контакты</a></li>
              <li><a href="#" data-route="/partners">Партнеры</a></li>
            </ul>
          </nav>
            <div class="header-buttons">
              <a href="" class="btn display-none" id="profile">Мой профиль</a>
              <a href="" class="btn" id="register">Регистрация</a>
              <a href="" class="btn border-btn hover-btn" id="login">Войти</a>
            </div>
        </div>
      </header>
      <div class="login-popup-container">
        <span class="close" id="login-close-modal">&times;</span>
        <form class="login-popup">
           <div class="login-container">
              <label for="login-username">Username</label>
              <input type="text" placeholder="Enter Username" id="login-username" name="login-username" required autocomplete="current-password">

              <label for="login-password">Password</label>
              <input type="password" placeholder="Enter Password" id="login-password" name="login-password" required autocomplete="username">

              <button type="button" id="login-button">Login</button>
            </div>
        </form>  
      </div>

      <div class="register-popup-container">
        <span class="close" id="register-close-modal">&times;</span>
        <form class="login-popup">
           <div class="login-container">
              <label for="register-username">Username</label>
              <input type="text" placeholder="Enter Username" id="register-username" name="register-username" required autocomplete="username">

              <label for="register-password">Password</label>
              <input type="password" placeholder="Enter Password" id="register-password" name="register-password" required autocomplete="new-password">

              <label for="register-email">Email</label>
              <input type="email" placeholder="Enter email" id="register-email" name="register-email" required autocomplete="email">

              <button type="submit" id="register-button">Register</button>
            </div>
        </form>
      </div>

      <div id="app"></div>

      <footer>
        <div class="footer-container">
            <div class="footer-logo">
              <a href="https://github.com/23Valerio">Powered by Valerii Kuiovda</a>
            </div>
            <div class="footer-links">
              <a href="https://www.facebook.com/profile.php?id=61552132769348">
                <img src="Facebook.svg" alt="">
              </a>
              <a href="https://www.instagram.com/teatr.tresk/">
                <img src="Instagram.svg" alt="">
              </a>
              <a href="#">
                <img src="Linkedin.svg" alt="">
              </a>
            </div>
        </div>
      </footer>
    </div>

    
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
